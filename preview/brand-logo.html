<style>
  body { padding: var(--espaco-5); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--espaco-3); }
  .tile { background: var(--cor-superficie); border: 1px solid var(--cor-borda); border-radius: 12px; padding: var(--espaco-5); display: flex; flex-direction: column; align-items: center; gap: 12px; }
  .tile.dark { background: var(--areia-900); border-color: var(--areia-900); }
  .tile.dark .mark { color: var(--areia-50); }
  .tile.accent { background: var(--acento-500); border-color: var(--acento-500); }
  .tile.accent .mark { color: var(--areia-50); }
  .mark { width: 56px; height: 56px; color: var(--cor-texto-forte); }
  .mark svg { width: 100%; height: 100%; }
  .meta { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cor-texto-suave); }
  .dark .meta, .accent .meta { color: rgba(250,247,241,0.7); }

  .lockup { display: flex; align-items: center; gap: 10px; margin-top: var(--espaco-2); }
  .lockup .mark { width: 26px; height: 26px; color: var(--cor-texto-forte); }
  .lockup .nome { font-family: var(--fonte-ui); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--cor-texto-suave); }
</style></head>
