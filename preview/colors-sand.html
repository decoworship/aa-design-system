<!DOCTYPE html>
<!-- @dsCard group="Colors" name="Colors — Sand (areia)" subtitle="10-step warm neutral · the base of the entire system" viewport="700x170" -->
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Colors — Sand (neutro)</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: var(--espaco-5); }
  .swatches { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; }
  .sw { border-radius: 8px; overflow: hidden; border: 1px solid rgba(34,31,26,0.06); }
  .sw .chip { height: 72px; }
  .sw .lbl  { padding: 6px 8px; background: var(--cor-superficie); }
  .sw .lbl b { display: block; font-size: 11px; font-weight: 600; color: var(--cor-texto); }
  .sw .lbl span { display: block; font-size: 10px; color: var(--cor-texto-suave); font-variant-numeric: tabular-nums; font-family: ui-monospace, "SF Mono", monospace; }
  .caption { font-size: 13px; color: var(--cor-texto-suave); margin-top: var(--espaco-3); }
  .caption b { color: var(--cor-texto); font-weight: 600; }
</style></head>
<body>
  <div class="card-root">
    <div class="swatches">
      <div class="sw"><div class="chip" style="background:#FAF7F1"></div><div class="lbl"><b>50</b><span>FAF7F1</span></div></div>
      <div class="sw"><div class="chip" style="background:#F4EFE6"></div><div class="lbl"><b>100</b><span>F4EFE6</span></div></div>
      <div class="sw"><div class="chip" style="background:#E9E1D2"></div><div class="lbl"><b>200</b><span>E9E1D2</span></div></div>
      <div class="sw"><div class="chip" style="background:#DAD0BC"></div><div class="lbl"><b>300</b><span>DAD0BC</span></div></div>
      <div class="sw"><div class="chip" style="background:#C2B69D"></div><div class="lbl"><b>400</b><span>C2B69D</span></div></div>
      <div class="sw"><div class="chip" style="background:#A6987D"></div><div class="lbl"><b>500</b><span>A6987D</span></div></div>
      <div class="sw"><div class="chip" style="background:#847A63"></div><div class="lbl"><b>600</b><span>847A63</span></div></div>
      <div class="sw"><div class="chip" style="background:#5F584A"></div><div class="lbl"><b>700</b><span>5F584A</span></div></div>
      <div class="sw"><div class="chip" style="background:#3D382F"></div><div class="lbl"><b>800</b><span>3D382F</span></div></div>
      <div class="sw"><div class="chip" style="background:#221F1A"></div><div class="lbl"><b>900</b><span>221F1A</span></div></div>
    </div>
    <div class="caption"><b>areia</b> — the warm-sand neutral scale. The whole system layers on this. Never use cool greys; pure white isn't in the palette.</div>
  </div>
</body></html>
