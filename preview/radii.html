<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Border radii" subtitle="pequeno 6 · médio 10 · grande 16 · pílula 999" viewport="700x200" -->
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Radii</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: var(--espaco-5); }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: var(--espaco-4); }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .quad { width: 92px; height: 92px; background: var(--primaria-100); border: 1px solid var(--primaria-300); }
  .meta b { display: block; font-size: 13px; font-weight: 600; color: var(--cor-texto); text-align: center; }
  .meta span { display: block; font-size: 11px; color: var(--cor-texto-suave); text-align: center; font-family: ui-monospace, "SF Mono", monospace; }
  .meta i { display: block; font-style: normal; font-size: 11px; color: var(--cor-texto-suave); text-align: center; margin-top: 2px; }
</style></head>
<body>
  <div class="card-root">
    <div class="grid">
      <div class="item">
        <div class="quad" style="border-radius:6px"></div>
        <div class="meta"><b>pequeno</b><span>6px</span><i>campos</i></div>
      </div>
      <div class="item">
        <div class="quad" style="border-radius:10px"></div>
        <div class="meta"><b>médio</b><span>10px</span><i>botões</i></div>
      </div>
      <div class="item">
        <div class="quad" style="border-radius:16px"></div>
        <div class="meta"><b>grande</b><span>16px</span><i>cards</i></div>
      </div>
      <div class="item">
        <div class="quad" style="border-radius:999px"></div>
        <div class="meta"><b>pílula</b><span>999px</span><i>badges</i></div>
      </div>
    </div>
  </div>
</body></html>
