<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Shadows" subtitle="Three levels, all warm-tinted with areia-900 alpha" viewport="700x220" -->
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Shadows</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: var(--espaco-6) var(--espaco-5); background: var(--cor-fundo); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--espaco-5); }
  .item { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tile { width: 100%; height: 92px; background: var(--cor-superficie); border-radius: 10px; }
  .meta b { display: block; font-size: 13px; font-weight: 600; color: var(--cor-texto); text-align: center; }
  .meta span { display: block; font-size: 10px; color: var(--cor-texto-suave); text-align: center; font-family: ui-monospace, "SF Mono", monospace; margin-top: 2px; }
  .meta i { display: block; font-style: normal; font-size: 11px; color: var(--cor-texto-suave); text-align: center; margin-top: 4px; }
</style></head>
<body>
  <div class="card-root">
    <div class="grid">
      <div class="item">
        <div class="tile" style="box-shadow: 0 1px 2px rgba(34,31,26,0.06)"></div>
        <div class="meta"><b>sombra-pequena</b><span>0 1px 2px · 6%</span><i>elementos elevados sutis</i></div>
      </div>
      <div class="item">
        <div class="tile" style="box-shadow: 0 4px 12px rgba(34,31,26,0.08)"></div>
        <div class="meta"><b>sombra-média</b><span>0 4px 12px · 8%</span><i>popovers, menus</i></div>
      </div>
      <div class="item">
        <div class="tile" style="box-shadow: 0 12px 28px rgba(34,31,26,0.12)"></div>
        <div class="meta"><b>sombra-grande</b><span>0 12px 28px · 12%</span><i>modais</i></div>
      </div>
    </div>
  </div>
</body></html>
