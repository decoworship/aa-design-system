<!DOCTYPE html>
<!-- @dsCard group="Componentes — Feedback" name="Gaveta, pilha de avisos, multi-seleção" subtitle="Sobreposições e escolha múltipla · troque o estilo e clique para ver" viewport="880x640" -->
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Sobreposições</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0;padding:0}body{width:880px;height:640px;box-sizing:border-box;padding:var(--espaco-6);background:var(--cor-fundo);overflow:hidden}
.rot{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--cor-texto-suave)}
.col{display:flex;flex-direction:column;gap:var(--espaco-4)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const { Gaveta, PilhaAvisos, Avisos, MultiSelecao, Botao, Campo, Etiqueta } = window.AADesignSystem_ada6b1;

const EQUIPE = ['Ana Prado','Bruno Sá','Carla Nunes','Diego Alves','Elisa Rocha','Felipe Braga','Gabi Moura','Hugo Lima','Iris Teles','João Verde'];

function Demo() {
  const { avisos, avisar, dispensar } = Avisos.usar({ limite: 3 });
  const [estilo, setEstilo] = React.useState('aa');
  React.useEffect(() => { document.documentElement.setAttribute('data-estilo', estilo); }, [estilo]);
  const [lado, setLado] = React.useState(null);
  const [resp, setResp] = React.useState(['Ana Prado','Bruno Sá']);
  const [etapas, setEtapas] = React.useState([]);
  return (
    <React.Fragment>
      <div style={{display:'flex',alignItems:'center',gap:'var(--espaco-3)',marginBottom:'var(--espaco-5)'}}>
        <span className="rot">Estilo</span>
        {['aa','vidro'].map((e) => (
          <Botao key={e} variante={estilo === e ? 'primario' : 'secundario'} onClick={() => setEstilo(e)}>{e}</Botao>
        ))}
        <span style={{fontSize:13,color:'var(--cor-texto-suave)'}}>
          Só a camada que flutua muda. Abra a gaveta ou um aviso para ver.
        </span>
      </div>
      <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'var(--espaco-6)'}}>
        <div className="col">
          <div className="rot">Multi-seleção</div>
          <MultiSelecao rotulo="Responsáveis" opcoes={EQUIPE} valor={resp} aoMudar={setResp}
            dica="A busca aparece a partir de nove opções." />
          <MultiSelecao rotulo="Etapas incluídas" opcoes={['Demolição','Hidráulica','Elétrica','Acabamento']}
            valor={etapas} aoMudar={setEtapas} limite={2} placeholder="Escolha até duas" />
        </div>
        <div className="col">
          <div className="rot">Gaveta</div>
          <div style={{display:'flex',gap:'var(--espaco-3)',flexWrap:'wrap'}}>
            <Botao variante="secundario" onClick={() => setLado('direita')}>À direita</Botao>
            <Botao variante="secundario" onClick={() => setLado('baixo')}>De baixo (mobile)</Botao>
          </div>
          <div className="rot" style={{marginTop:8}}>Pilha de avisos</div>
          <div style={{display:'flex',gap:'var(--espaco-3)',flexWrap:'wrap'}}>
            <Botao variante="secundario" onClick={() => avisar({variante:'sucesso',titulo:'Salvo',mensagem:'Reforma da cozinha foi atualizada.'})}>Sucesso</Botao>
            <Botao variante="secundario" onClick={() => avisar({variante:'erro',titulo:'Não deu',mensagem:'A conexão caiu no meio do envio.'})}>Erro</Botao>
            <Botao variante="secundario" onClick={() => avisar({variante:'info',titulo:'Item arquivado',acao:{rotulo:'Desfazer'}})}>Com ação</Botao>
          </div>
          <p style={{margin:0,fontSize:13,lineHeight:1.55,color:'var(--cor-texto-suave)'}}>
            Três na tela no máximo. Info e sucesso somem em cinco segundos; erro e aviso com ação esperam.
          </p>
        </div>
      </div>
      <Gaveta aberta={lado !== null} lado={lado || 'direita'} rotulo="Projeto" titulo="Reforma da cozinha"
        aoFechar={() => setLado(null)}
        acoes={<React.Fragment><Botao variante="texto" onClick={() => setLado(null)}>Cancelar</Botao><Botao onClick={() => { setLado(null); avisar({variante:'sucesso',titulo:'Salvo'}); }}>Salvar</Botao></React.Fragment>}>
        <div style={{display:'flex',flexDirection:'column',gap:'var(--espaco-4)'}}>
          <div style={{display:'flex',gap:8}}><Etiqueta variante="sucesso">Em obra</Etiqueta><Etiqueta>Prioridade alta</Etiqueta></div>
          <Campo rotulo="Nome" valor="Reforma da cozinha" />
          <MultiSelecao rotulo="Responsáveis" opcoes={EQUIPE} valor={resp} aoMudar={setResp} />
        </div>
      </Gaveta>
      <PilhaAvisos avisos={avisos} aoDispensar={dispensar} />
    </React.Fragment>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
