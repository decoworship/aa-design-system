<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Spacing scale" subtitle="Base 4px · eight steps only · 4 / 8 / 12 / 16 / 24 / 32 / 48 / 64" viewport="700x300" -->
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Spacing</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: var(--espaco-5) var(--espaco-6); }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row-s { display: grid; grid-template-columns: 64px 1fr 64px; gap: var(--espaco-3); align-items: center; }
  .row-s .name { font-size: 12px; font-weight: 600; color: var(--cor-texto); font-family: ui-monospace, "SF Mono", monospace; }
  .row-s .bar { background: var(--acento-500); height: 14px; border-radius: 3px; }
  .row-s .val { font-size: 11px; color: var(--cor-texto-suave); font-variant-numeric: tabular-nums; text-align: right; }
  .caption { font-size: 12px; color: var(--cor-texto-suave); margin-top: var(--espaco-2); }
</style></head>
<body>
  <div class="card-root">
    <div class="rows">
      <div class="row-s"><span class="name">espaco-1</span><div class="bar" style="width:4px"></div><span class="val">4px</span></div>
      <div class="row-s"><span class="name">espaco-2</span><div class="bar" style="width:8px"></div><span class="val">8px</span></div>
      <div class="row-s"><span class="name">espaco-3</span><div class="bar" style="width:12px"></div><span class="val">12px</span></div>
      <div class="row-s"><span class="name">espaco-4</span><div class="bar" style="width:16px"></div><span class="val">16px</span></div>
      <div class="row-s"><span class="name">espaco-5</span><div class="bar" style="width:24px"></div><span class="val">24px</span></div>
      <div class="row-s"><span class="name">espaco-6</span><div class="bar" style="width:32px"></div><span class="val">32px</span></div>
      <div class="row-s"><span class="name">espaco-7</span><div class="bar" style="width:48px"></div><span class="val">48px</span></div>
      <div class="row-s"><span class="name">espaco-8</span><div class="bar" style="width:64px"></div><span class="val">64px</span></div>
    </div>
    <div class="caption">Base 4px. Use only these eight values — round "about 20px" to 16 or 24.</div>
  </div>
</body></html>
