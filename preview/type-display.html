<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Type — Display</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: var(--espaco-6); }
  .specimen { font-family: var(--fonte-display); font-weight: 600; font-size: 64px; line-height: 1; color: var(--cor-texto-forte); letter-spacing: -0.015em; }
  .meta { display: flex; gap: var(--espaco-4); margin-top: var(--espaco-4); align-items: baseline; }
  .meta .name { font-size: 13px; font-weight: 600; color: var(--cor-texto); }
  .meta .spec { font-size: 11px; color: var(--cor-texto-suave); }
</style></head>
<body>
  <div class="card-root">
    <div class="specimen">Casa &amp; projetos</div>
    <div class="meta">
      <span class="name">Fraunces</span>
      <span class="spec">600 · variable opsz 9–144</span>
      <span class="spec">used only at display sizes (≥32px)</span>
    </div>
  </div>
</body></html>
