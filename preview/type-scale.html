<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type — Scale" subtitle="Six steps: Display / Título G / Título M / Corpo / Pequeno / Rótulo" viewport="700x380" -->
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Type — Scale</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: var(--espaco-5) var(--espaco-6); }
  .row-t { display: grid; grid-template-columns: 88px 1fr auto; gap: var(--espaco-4); align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--cor-borda); }
  .row-t:last-child { border-bottom: none; }
  .row-t .tag { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--cor-texto-suave); }
  .row-t .spec { font-size: 11px; color: var(--cor-texto-suave); font-variant-numeric: tabular-nums; }
  .t-display  { font-family: var(--fonte-display); font-size: 36px; font-weight: 600; line-height: 1.1; color: var(--cor-texto-forte); }
  .t-titulo-g { font-family: var(--fonte-ui); font-size: 24px; font-weight: 600; color: var(--cor-texto-forte); }
  .t-titulo-m { font-family: var(--fonte-ui); font-size: 18px; font-weight: 600; color: var(--cor-texto-forte); }
  .t-corpo    { font-family: var(--fonte-ui); font-size: 15px; color: var(--cor-texto); }
  .t-pequeno  { font-family: var(--fonte-ui); font-size: 13px; color: var(--cor-texto-suave); }
  .t-rotulo   { font-family: var(--fonte-ui); font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--cor-texto-suave); }
</style></head>
<body>
  <div class="card-root">
    <div class="row-t"><span class="tag">Display</span><span class="t-display">Casa &amp; projetos</span><span class="spec">Fraunces 36/1.1</span></div>
    <div class="row-t"><span class="tag">Título G</span><span class="t-titulo-g">Resumo do mês</span><span class="spec">Hanken 24/1.25 · 600</span></div>
    <div class="row-t"><span class="tag">Título M</span><span class="t-titulo-m">Despesas recentes</span><span class="spec">Hanken 18/1.35 · 600</span></div>
    <div class="row-t"><span class="tag">Corpo</span><span class="t-corpo">Texto padrão de interface.</span><span class="spec">Hanken 15/1.55 · 400</span></div>
    <div class="row-t"><span class="tag">Pequeno</span><span class="t-pequeno">Apoio, legendas e dicas.</span><span class="spec">Hanken 13/1.5 · 400</span></div>
    <div class="row-t"><span class="tag">Rótulo</span><span class="t-rotulo">Categoria</span><span class="spec">Hanken 12/1.4 · 600 · ts 0.06em</span></div>
  </div>
</body></html>
