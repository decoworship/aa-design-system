<!DOCTYPE html>
<!-- @dsCard group="Type" name="Type — UI (Hanken Grotesk)" subtitle="Hanken Grotesk · the workhorse · loaded locally from /fonts" viewport="700x240" -->
<html lang="pt-BR"><head><meta charset="UTF-8"><title>Type — UI</title>
<link rel="stylesheet" href="_base.css">
<style>
  body { padding: var(--espaco-6); }
  .specimen { font-family: var(--fonte-ui); font-weight: 600; font-size: 42px; line-height: 1.1; color: var(--cor-texto-forte); letter-spacing: -0.005em; }
  .body { font-family: var(--fonte-ui); font-weight: 400; font-size: 15px; line-height: 1.55; color: var(--cor-texto); max-width: 60ch; margin-top: var(--espaco-2); }
  .meta { display: flex; gap: var(--espaco-4); margin-top: var(--espaco-3); align-items: baseline; }
  .meta .name { font-size: 13px; font-weight: 600; color: var(--cor-texto); }
  .meta .spec { font-size: 11px; color: var(--cor-texto-suave); }
</style></head>
<body>
  <div class="card-root">
    <div class="specimen">Resumo do mês</div>
    <div class="body">Texto padrão de interface, usado na maior parte do conteúdo das telas. Faz todo o trabalho de leitura: títulos médios, corpo, legendas e rótulos.</div>
    <div class="meta">
      <span class="name">Hanken Grotesk</span>
      <span class="spec">400 / 500 / 600 / 700</span>
      <span class="spec">all headings ≤24px and all body text</span>
    </div>
  </div>
</body></html>
