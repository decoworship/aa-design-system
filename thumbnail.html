<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><title>AA</title>
<link rel="stylesheet" href="styles.css">
<style>
html,body{margin:0;padding:0}
body{width:1280px;height:854px;display:grid;grid-template-columns:1fr 320px;overflow:hidden}
.marca{background:var(--primaria-500);display:flex;align-items:center;justify-content:center;color:var(--areia-50)}
.marca i{display:block;width:340px;height:340px;background:var(--areia-50);-webkit-mask:url(assets/logo-aa.svg) center/contain no-repeat;mask:url(assets/logo-aa.svg) center/contain no-repeat}
.faixa{display:grid;grid-template-rows:repeat(4,1fr)}
</style></head>
<body>
<div class="marca"><i></i></div>
<div class="faixa"><div style="background:#D0A24E"></div><div style="background:#C57B57"></div><div style="background:#5C7E58"></div><div style="background:#AE4A3C"></div></div>
</body></html>
